# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
# Ensure common test packages are included in images.
# Production Wi-Fi behavior is controlled per-image:
# - build-spinyos       -> wifi-manager
# - build-spinyos-debug -> wlan-up
IMAGE_INSTALL:append = " helloworld etka systemd device-ingest e2fsprogs-resize2fs parted neofetch "
 

# Enable splash screen

# Kernel command line için splash enable (Raspberry Pi için)
KERNEL_CMDLINE:append = " splash quiet logo.nologo vt.global_cursor_default=0"
# Produce Raspberry Pi SD card image (rpi-sdimg) as part of the deploy output.
# Users can alternatively add this line to build/conf/local.conf:
#   IMAGE_FSTYPES:append = " rpi-sdimg"


# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-spiny"
BBFILE_PATTERN_meta-spiny = "^${LAYERDIR}/"
# Increased priority to override meta-raspberrypi (9) for psplash fixes
BBFILE_PRIORITY_meta-spiny = "10"

# Allow 'expand-rootfs' as a supported image feature in this layer
VALID_IMAGE_FEATURES:append = " expand-rootfs"

LAYERDEPENDS_meta-spiny = "core"
LAYERSERIES_COMPAT_meta-spiny = "kirkstone"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit" 
VIRTUAL-RUNTIME_initscripts = ""